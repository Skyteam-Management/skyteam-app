[build]
  command = "npm run build"
  # Angular's application builder outputs the browser bundle into a
  # `browser/` subdir (alongside `prerendered-routes.json`). Publish that.
  publish = "dist/skyteam_app/browser"

[build.environment]
  # Angular 21 requires Node 20.19+ or 22.12+. .nvmrc / .node-version are
  # also present; this is the explicit, in-repo source of truth. Note that
  # a NODE_VERSION env var set in the Netlify UI will OVERRIDE this — if
  # builds keep landing on Node 18, clear it from Site settings → Build
  # & deploy → Environment.
  NODE_VERSION = "22.12.0"

# SPA fallback is handled by src/_redirects, which Angular copies to
# dist/skyteam_app/_redirects via the assets list in angular.json. No
# [[redirects]] block here so we don't duplicate that.
