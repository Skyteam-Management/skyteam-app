<div class="w-full max-w-sm">

  <!-- mobile-only brand (desktop has the brand panel beside) -->
  <div class="lg:hidden mb-10 flex flex-col items-center gap-3 auth-rise" style="animation-delay: 60ms">
    <a href="https://www.jesusrodriguezc.com/" target="_blank" rel="noopener" class="block">
      <img src="./assets/logo.png" alt="Logo" class="h-14 w-auto opacity-95" />
    </a>
    <h1 class="font-(family-name:--font-display) text-3xl tracking-tight text-center" style="font-variation-settings: 'opsz' 96;">
      Abundant <span class="italic text-(--color-gold)">Virtual</span> Money
    </h1>
  </div>

  <!-- header (eyebrow + title) -->
  <div class="mb-9 auth-rise" style="animation-delay: 140ms">
    <div class="flex items-center gap-3 mb-5">
      <span class="block h-px w-10 bg-(--color-gold)"></span>
      <span class="text-[11px] uppercase tracking-[0.32em] text-(--color-muted-foreground)">Iniciar sesión</span>
    </div>
    <h2 class="font-(family-name:--font-display) text-4xl lg:text-[2.6rem] leading-[1.05] tracking-tight"
        style="font-variation-settings: 'opsz' 96, 'SOFT' 30;">
      Bienvenido<span class="text-(--color-gold)">.</span>
    </h2>
    <p class="mt-3 text-sm text-(--color-muted-foreground)">
      Ingresa tus credenciales para continuar.
    </p>
  </div>

  <form [formGroup]="loginForm" (ngSubmit)="logIn()" class="flex flex-col gap-5 auth-rise" style="animation-delay: 220ms">

    <!-- email -->
    <div class="flex flex-col gap-2">
      <label for="email" class="text-[11px] uppercase tracking-[0.22em] text-(--color-muted-foreground)">Correo electrónico</label>
      <div class="relative group">
        <input
          #emailInput
          id="email"
          type="email"
          formControlName="email"
          placeholder="tu@correo.com"
          autocomplete="email"
          class="peer w-full h-12 rounded-md border border-(--color-border) bg-(--color-input)/60 backdrop-blur-sm px-4 pr-11 text-sm text-(--color-foreground) placeholder:text-(--color-muted-foreground)/70 transition-colors focus-visible:outline-none focus-visible:border-(--color-gold)/60 focus-visible:bg-(--color-input)/90 focus-visible:ring-2 focus-visible:ring-(--color-gold)/30"
        />
        <svg lucideIcon [lucideIcon]="Mail" class="absolute right-3.5 top-1/2 -translate-y-1/2 size-4 text-(--color-muted-foreground) peer-focus-visible:text-(--color-gold) transition-colors"></svg>
      </div>
    </div>

    <!-- password -->
    <div class="flex flex-col gap-2">
      <label for="password" class="text-[11px] uppercase tracking-[0.22em] text-(--color-muted-foreground)">Contraseña</label>
      <div class="relative group">
        <input
          #passwordInput
          id="password"
          [type]="hide() ? 'password' : 'text'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
          class="peer w-full h-12 rounded-md border border-(--color-border) bg-(--color-input)/60 backdrop-blur-sm px-4 pr-11 text-sm text-(--color-foreground) placeholder:text-(--color-muted-foreground)/70 transition-colors focus-visible:outline-none focus-visible:border-(--color-gold)/60 focus-visible:bg-(--color-input)/90 focus-visible:ring-2 focus-visible:ring-(--color-gold)/30"
        />
        <button
          type="button"
          (click)="togglePassword()"
          [attr.aria-label]="hide() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          class="absolute right-2 top-1/2 -translate-y-1/2 inline-flex items-center justify-center size-8 rounded text-(--color-muted-foreground) hover:text-(--color-gold) hover:bg-(--color-gold)/10 transition-colors"
        >
          <svg lucideIcon [lucideIcon]="hide() ? EyeOff : Eye" class="size-4"></svg>
        </button>
      </div>
    </div>

    <!-- submit -->
    <button
      type="submit"
      [disabled]="submitting()"
      [class.opacity-60]="submitting() || !loginForm.valid"
      class="group relative mt-3 inline-flex items-center justify-center h-12 rounded-md bg-(--color-gold) text-(--color-gold-foreground) text-sm font-semibold tracking-wide hover:bg-(--color-gold)/90 transition-all overflow-hidden disabled:cursor-wait"
    >
      <span class="relative z-10">{{ submitting() ? 'Ingresando…' : 'Ingresar' }}</span>
      <span aria-hidden="true" class="absolute inset-0 bg-gradient-to-r from-white/0 via-white/30 to-white/0 -translate-x-full group-hover:translate-x-full transition-transform duration-700"></span>
    </button>

    <!-- ornament -->
    <div class="mt-4 flex items-center gap-3 text-(--color-muted-foreground)/60">
      <span class="block h-px flex-1 bg-(--color-border)"></span>
      <span class="text-[10px] uppercase tracking-[0.4em]">AVM · MMXXVI</span>
      <span class="block h-px flex-1 bg-(--color-border)"></span>
    </div>
  </form>
</div>
