<main class="relative min-h-screen overflow-hidden bg-(--color-background) text-(--color-foreground)">

  <!-- ============ background layers ============ -->
  <div aria-hidden="true" class="pointer-events-none absolute inset-0 -z-0">
    <!-- warm gold glow, top-right -->
    <div class="absolute -top-48 -right-40 h-[42rem] w-[42rem] rounded-full bg-(--color-gold)/12 blur-[140px]"></div>
    <!-- cool deep glow, bottom-left -->
    <div class="absolute -bottom-56 -left-48 h-[40rem] w-[40rem] rounded-full bg-(--color-card)/70 blur-[140px]"></div>
    <!-- soft diagonal accent -->
    <div class="absolute top-1/3 left-1/2 h-[26rem] w-[26rem] -translate-x-1/2 rounded-full bg-(--color-gold)/6 blur-[100px]"></div>
    <!-- dot grid -->
    <div class="auth-dots absolute inset-0 opacity-70 [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_75%)]"></div>
    <!-- grain -->
    <div class="auth-grain absolute inset-0 opacity-[0.10] mix-blend-overlay"></div>
    <!-- vignette -->
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,transparent_45%,oklch(0.08_0_0)_100%)]"></div>
  </div>

  <!-- ============ content ============ -->
  <div class="relative grid min-h-screen grid-cols-1 lg:grid-cols-[1.1fr_1fr]">

    <!-- brand panel — desktop only -->
    <section class="relative hidden lg:flex flex-col justify-between px-14 xl:px-20 py-14 xl:py-20">
      <!-- top: small mark -->
      <div class="flex items-center gap-3 auth-rise" style="animation-delay: 60ms">
        <span class="block h-px w-12 bg-(--color-gold)/60"></span>
        <span class="text-[11px] uppercase tracking-[0.32em] text-(--color-muted-foreground)">Acceso privado</span>
      </div>

      <!-- middle: oversized typographic logo -->
      <div class="auth-rise" style="animation-delay: 160ms">
        <h1 class="font-(family-name:--font-display) font-light leading-[0.86] tracking-tight text-[clamp(4rem,11vw,11rem)]"
            style="font-variation-settings: 'opsz' 144, 'SOFT' 30;">
          <span class="block">Abundant</span>
          <span class="block italic text-(--color-gold)" style="font-variation-settings: 'opsz' 144, 'SOFT' 80;">Virtual</span>
          <span class="block">Money<span class="text-(--color-gold)">.</span></span>
        </h1>

        <div class="mt-10 flex items-center gap-4">
          <span class="block h-px w-10 bg-(--color-muted-foreground)/40"></span>
          <p class="font-(family-name:--font-display) italic text-lg text-(--color-muted-foreground) max-w-md"
             style="font-variation-settings: 'opsz' 36;">
            Un panel, una sesión — la administración de tu portafolio en un solo lugar.
          </p>
        </div>
      </div>

      <!-- bottom meta -->
      <div class="flex items-end justify-between text-[11px] uppercase tracking-[0.28em] text-(--color-muted-foreground)/70 auth-rise" style="animation-delay: 260ms">
        <span>MMXXVI</span>
        <span class="hidden xl:inline">Panel privado · Acceso restringido</span>
        <span>AVM</span>
      </div>
    </section>

    <!-- form panel -->
    <section class="relative flex items-center justify-center px-6 py-12 sm:px-10 lg:px-14">
      <!-- vertical gold rule between panels on desktop -->
      <div aria-hidden="true" class="hidden lg:block absolute left-0 top-16 bottom-16 w-px bg-gradient-to-b from-transparent via-(--color-gold)/35 to-transparent"></div>
      <router-outlet></router-outlet>
    </section>

  </div>
</main>
