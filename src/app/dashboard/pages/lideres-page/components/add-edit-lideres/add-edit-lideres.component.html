<div class="w-full max-w-md rounded-lg border border-(--color-border) bg-(--color-card) shadow-2xl">
  <div class="flex items-start justify-between gap-4 px-6 py-5 border-b border-(--color-border)">
    <div>
      <div class="flex items-center gap-2.5 mb-1.5">
        <span class="block h-px w-6 bg-(--color-gold)"></span>
        <span class="text-[10px] uppercase tracking-[0.32em] text-(--color-muted-foreground)">{{ data?.id ? 'Editar' : 'Nuevo' }}</span>
      </div>
      <h2 class="font-(family-name:--font-display) text-2xl tracking-tight leading-none" style="font-variation-settings: 'opsz' 72;">Patrocinador</h2>
    </div>
    <button
      type="button"
      (click)="close()"
      aria-label="Cerrar"
      class="inline-flex items-center justify-center size-8 rounded-md text-(--color-muted-foreground) hover:bg-(--color-accent) hover:text-(--color-foreground) transition-colors"
    >
      <svg lucideIcon [lucideIcon]="X" class="size-4"></svg>
    </button>
  </div>

  <form [formGroup]="liderForm" (ngSubmit)="onFormSubmit()" class="px-6 py-5 flex flex-col gap-4">
    <div class="flex flex-col gap-1.5">
      <label for="lider-nombre" class="text-sm font-medium">Nombre</label>
      <input
        id="lider-nombre"
        type="text"
        formControlName="nombre"
        appUppercase
        placeholder="NOMBRE DEL PATROCINADOR"
        class="h-10 rounded-md border border-(--color-border) bg-(--color-input) px-3 text-sm placeholder:text-(--color-muted-foreground) focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-(--color-ring)"
      />
    </div>

    <div class="flex flex-col gap-1.5">
      <label for="lider-apellido" class="text-sm font-medium">Apellido</label>
      <input
        id="lider-apellido"
        type="text"
        formControlName="apellido"
        appUppercase
        placeholder="APELLIDO DEL PATROCINADOR"
        class="h-10 rounded-md border border-(--color-border) bg-(--color-input) px-3 text-sm placeholder:text-(--color-muted-foreground) focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-(--color-ring)"
      />
    </div>

    <div class="flex items-center justify-end gap-2 pt-2 border-t border-(--color-border) -mx-6 px-6 mt-2">
      <button
        type="button"
        (click)="close()"
        class="inline-flex items-center justify-center h-9 px-4 rounded-md border border-(--color-border) bg-transparent text-sm font-medium hover:bg-(--color-accent) transition-colors"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [class.opacity-50]="!liderForm.valid"
        class="inline-flex items-center justify-center h-9 px-4 rounded-md bg-(--color-primary) text-(--color-primary-foreground) text-sm font-medium hover:opacity-90 transition-opacity"
      >
        {{ data?.id ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
