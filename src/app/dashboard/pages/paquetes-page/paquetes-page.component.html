<div class="flex flex-col gap-8">
  <div class="flex items-end justify-between gap-4 flex-wrap">
    <div>
      <div class="flex items-center gap-3 mb-3">
        <span class="block h-px w-10 bg-(--color-gold)"></span>
        <span class="text-[11px] uppercase tracking-[0.32em] text-(--color-muted-foreground)">Catálogo</span>
      </div>
      <h1 class="font-(family-name:--font-display) text-4xl tracking-tight leading-none" style="font-variation-settings: 'opsz' 96, 'SOFT' 30;">
        Paquetes<span class="text-(--color-gold)">.</span>
      </h1>
      <p class="mt-3 text-sm text-(--color-muted-foreground) max-w-md">
        Catálogo de paquetes disponibles para los clientes.
      </p>
    </div>
    <button
      type="button"
      (click)="openAddForm()"
      class="group relative inline-flex items-center gap-2 h-10 px-5 rounded-md bg-(--color-primary) text-(--color-primary-foreground) text-sm font-semibold tracking-wide hover:bg-(--color-primary)/90 transition-colors overflow-hidden"
    >
      <svg lucideIcon [lucideIcon]="Plus" class="relative z-10 size-4"></svg>
      <span class="relative z-10">Añadir paquete</span>
    </button>
  </div>

  <app-paquetes-table />
</div>
