<div class="flex flex-col gap-6">
  <div class="flex items-center justify-between gap-4 flex-wrap">
    <div>
      <h1 class="text-2xl font-semibold tracking-tight">Clientes</h1>
      <p class="text-sm text-(--color-muted-foreground) mt-1">Gestiona clientes, paquetes y vencimientos.</p>
    </div>
    <button
      type="button"
      (click)="openAddForm()"
      class="inline-flex items-center gap-2 h-9 px-4 rounded-md bg-(--color-primary) text-(--color-primary-foreground) text-sm font-medium hover:opacity-90 transition-opacity"
    >
      <svg lucideIcon [lucideIcon]="Plus" class="size-4"></svg>
      Añadir cliente
    </button>
  </div>

  <app-clientes-table />
</div>
