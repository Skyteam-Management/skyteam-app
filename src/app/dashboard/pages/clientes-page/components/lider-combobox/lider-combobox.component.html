<div class="relative">
  <input
    type="text"
    [value]="query()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown)="onKeyDown($event)"
    placeholder="BUSCA O ELIGE UN PATROCINADOR"
    autocomplete="off"
    appUppercase
    class="w-full h-10 rounded-md border border-(--color-border) bg-(--color-input) px-3 pr-9 text-sm placeholder:text-(--color-muted-foreground) focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-(--color-ring) disabled:opacity-50"
  />
  <svg lucideIcon [lucideIcon]="ChevronDown" class="pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2 size-4 text-(--color-muted-foreground)"></svg>

  @if (open()) {
    @if (filtered().length > 0) {
      <ul
        role="listbox"
        class="absolute z-20 top-full mt-1 left-0 right-0 max-h-60 overflow-auto rounded-md border border-(--color-border) bg-(--color-card) shadow-lg py-1"
      >
        @for (l of filtered(); track l.id; let i = $index) {
          <li
            role="option"
            [attr.aria-selected]="i === highlight()"
            (mousedown)="select(l)"
            (mouseenter)="highlight.set(i)"
            [class.bg-(--color-accent)]="i === highlight()"
            class="px-3 py-2 text-sm cursor-pointer hover:bg-(--color-accent)"
          >
            {{ l.nombre }} {{ l.apellido }}
          </li>
        }
      </ul>
    } @else {
      <div class="absolute z-20 top-full mt-1 left-0 right-0 rounded-md border border-(--color-border) bg-(--color-card) shadow-lg px-3 py-2 text-sm text-(--color-muted-foreground)">
        Sin resultados para "{{ query() }}"
      </div>
    }
  }
</div>
