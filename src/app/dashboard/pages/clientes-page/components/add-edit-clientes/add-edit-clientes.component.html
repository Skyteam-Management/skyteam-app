<div mat-dialog-title>
  <h1>{{data ? 'Editar': 'Agregar'}} Cliente</h1>
</div>
<form [formGroup]="clientForm" (ngSubmit)="onFormSubmit()">
  <div class="content">
    <div class="row">
      <div class="col">
        <mat-form-field appearance="outline">
          <mat-label>Nombre Completo</mat-label>
          <input matInput formControlName="nombre" type="text" placeholder="Nombre del Cliente">
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <mat-form-field appearance="outline">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="telefono" type="tel" placeholder="Teléfono del Cliente" maxlength="20">
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <mat-form-field appearance="outline">
          <mat-label>Paquete</mat-label>
          <mat-select formControlName="paquete">
            @for (paquete of paquetes; track paquete) {
              <mat-option [value]="paquete?.id">
                {{paquete?.nombre}}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <mat-form-field appearance="outline">
          <mat-label>Líder</mat-label>
          <mat-select formControlName="lider">
            @for (lider of lideres(); track lider.id) {
              <mat-option [value]="lider.id">
                {{lider.nombre }} {{lider.apellido}}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="col">
        <mat-form-field appearance="outline">
          <mat-label>Fecha de Pago</mat-label>
          <input matInput formControlName="fechaInicio" [matDatepicker]="picker" [max]="maxDate">
          <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
        </mat-form-field>
      </div>
    </div>

  </div>
  <div class="content mb-4">
    <div class="d-flex justify-content-center">
      <button [disabled]="!clientForm.valid" class="btn btn-outline-light" type="submit">{{data ? 'Actualizar':
        'Guardar'}}
      </button>
      <button class="buton btn  btn-danger" type="button" [mat-dialog-close]="false">Cancelar
      </button>
    </div>
  </div>
</form>
