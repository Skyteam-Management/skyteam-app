<div class="w-full max-w-md rounded-lg border border-(--color-border) bg-(--color-card) shadow-2xl">
  <div class="p-6">
    <div class="flex items-start gap-4">
      <div class="inline-flex items-center justify-center size-10 rounded-full bg-(--color-destructive)/15 text-(--color-destructive) shrink-0">
        <svg lucideIcon [lucideIcon]="TriangleAlert" class="size-5"></svg>
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2.5 mb-1.5">
          <span class="block h-px w-5 bg-(--color-destructive)"></span>
          <span class="text-[10px] uppercase tracking-[0.32em] text-(--color-muted-foreground)">Confirmar</span>
        </div>
        <h2 class="font-(family-name:--font-display) text-xl tracking-tight leading-none" style="font-variation-settings: 'opsz' 60;">{{ data.title ?? 'Eliminar' }}</h2>
        <p class="text-sm text-(--color-muted-foreground) mt-3">
          {{ data.message ?? '¿Estás seguro?' }}
          @if (data.name) {
            <span class="font-medium text-(--color-foreground)"> {{ data.name }}</span>
          }
        </p>
      </div>
    </div>
  </div>

  <div class="flex items-center justify-end gap-2 px-6 py-4 border-t border-(--color-border)">
    <button
      type="button"
      (click)="close()"
      class="inline-flex items-center justify-center h-9 px-4 rounded-md border border-(--color-border) bg-transparent text-sm font-medium hover:bg-(--color-accent) transition-colors"
    >
      No, gracias
    </button>
    <button
      type="button"
      (click)="delete()"
      class="inline-flex items-center justify-center h-9 px-4 rounded-md bg-(--color-destructive) text-(--color-destructive-foreground) text-sm font-medium hover:opacity-90 transition-opacity"
    >
      Eliminar
    </button>
  </div>
</div>
